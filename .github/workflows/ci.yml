name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: swift-actions/setup-swift@v2          # action version UNVERIFIED; fallback: container image swift:6.1
        with:
          swift-version: "6.1"
      - run: swift --version
      - name: Fixture catalog
        run: make fixtures-check
      - name: Package tests (MailCore + MailHTML)
        id: core
        run: make core-test
        continue-on-error: true
      - name: Package tests without MailHTML (SwiftSoup-on-Linux fallback)
        if: steps.core.outcome == 'failure'
        run: make core-test-nohtml

  ios:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      SIM_DEST: platform=iOS Simulator,name=iPhone 17
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - name: Install tools
        run: brew install xcodegen                 # xcbeautify is preinstalled on macos-26
      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: .build/SourcePackages
          key: spm-${{ runner.os }}-xcode26.6-${{ hashFiles('project.yml', 'Packages/MailCore/Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-xcode26.6-
      - name: Lint
        run: make lint
      - name: Package tests on macOS (safety net for the Linux job)
        run: make core-test
      - name: App tests
        run: make test-app
      - name: Annotate failed tests               # annotations are readable without auth, unlike logs/artifacts
        if: failure()
        run: |
          for bundle in .build/results/*.xcresult; do
            [ -d "$bundle" ] || continue
            xcrun xcresulttool get test-results summary --path "$bundle" | python3 -c '
          import json, sys
          summary = json.load(sys.stdin)
          for failure in summary.get("testFailures", []):
              name = failure.get("testName") or failure.get("testIdentifier", "?")
              text = (failure.get("failureText") or "").replace("\n", " ")
              print(f"::error::FAILED {name}: {text}")
          ' || true
          done
      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: .build/results
